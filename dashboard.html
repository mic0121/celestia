<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Coulisses</title>
  <!-- Icône d'écran d'accueil (iPhone + Android) -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <meta name="apple-mobile-web-app-title" content="Coulisses">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07060f">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07060f; --card: #12101f; --card2: #181530; --line: #2a2440; --text: #e8e6f0;
      --muted: #8b86a3; --gold: #f2c35b; --gold-dim: #8a6a24; --new: #3b2a0a; --danger: #e5484d;
      --twin: #c084fc; --twin-bg: #241638;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    h1 { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: .12em; color: var(--gold); }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; }
    button, select, input {
      font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; font-size: 14px;
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--gold); color: #1a1205; border-color: var(--gold); }
    button.danger { color: var(--danger); border-color: #4a1d22; }
    button:active { transform: scale(.97); }

    /* Connexion */
    #login { display: none; max-width: 360px; margin: 18vh auto 0; padding: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
    #login h1 { margin-bottom: 16px; text-align: center; }
    #login input { width: 100%; margin-bottom: 10px; }
    #login button { width: 100%; }
    #login-err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; text-align: center; }

    /* Tableau de bord */
    #app { display: none; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
    .dot.on { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
    .count { font-family: 'Cinzel', serif; font-size: 44px; color: var(--gold); line-height: 1; }
    .presence { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
    .pbox { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
    .pbox .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .pbox .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .pbox.total { border-color: var(--gold-dim); }
    .pbox.total .n { color: var(--gold); }

    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
    .force-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .force-row select { flex: 1; }
    .force-state { font-size: 13px; margin-top: 8px; color: var(--muted); }
    .force-state b { color: var(--gold); }
    .panel.forced { border-color: var(--gold-dim); background: #1c1708; }

    .twins { background: var(--twin-bg); border: 1px solid #5b3a85; }
    .twins h2 { color: var(--twin); }
    .twin-line { margin-top: 8px; font-size: 15px; line-height: 1.4; }
    .twin-line b { color: var(--twin); }

    details.panel summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    details.panel summary::-webkit-details-marker { display: none; }
    details.panel summary::after { content: '▾'; color: var(--muted); }
    details.panel[open] summary::after { content: '▴'; }
    .q { border-top: 1px solid var(--line); padding: 10px 0 2px; margin-top: 10px; }
    .q .who { font-size: 12px; color: var(--muted); }
    .q .who b { color: var(--text); }
    .q .text { font-size: 15px; margin-top: 3px; line-height: 1.4; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--gold); color: #1a1205; vertical-align: 2px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .toolbar select { flex: 1 1 140px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
    .chip b { color: var(--text); }

    .entry {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px; transition: background 2s, border-color 2s;
    }
    .entry.fresh { background: var(--new); border-color: var(--gold-dim); }
    .entry.twin { border-color: #6d44a0; box-shadow: inset 3px 0 0 var(--twin); }
    .name { grid-column: 1 / -1; font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: .02em; }
    .dob { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
    .age { font-size: 22px; font-weight: 700; color: var(--gold); text-align: right; }
    .meta { font-size: 13px; color: var(--muted); }
    .meta b { color: var(--text); font-weight: 600; }
    .time { font-size: 12px; color: var(--muted); text-align: right; }
    .full { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
    .full b { color: var(--text); font-weight: 600; }
    .twin-tag { color: var(--twin); font-weight: 600; }
    .eq { grid-column: 1 / -1; background: var(--card2); border-radius: 10px; padding: 8px 10px; margin-top: 4px; font-size: 14px; line-height: 1.4; }
    .eq span { color: var(--muted); font-size: 12px; }
    .ctrl { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .ctrl select { flex: 1; min-width: 0; width: 100%; padding: 7px 10px; font-size: 13px; }
    .ctrl select.on { border-color: var(--gold); color: var(--gold); }
    .ctrl label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
    footer { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <!-- CONNEXION -->
  <div id="login">
    <h1>✦ COULISSES</h1>
    <input id="email" type="email" placeholder="Courriel" autocomplete="username">
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="primary" id="btn-login">Entrer</button>
    <div id="login-err"></div>
  </div>

  <!-- TABLEAU DE BORD -->
  <div id="app" class="wrap">
    <header>
      <div>
        <h1>✦ EN DIRECT</h1>
        <div class="live"><span class="dot" id="dot"></span><span id="status">Connexion…</span></div>
      </div>
      <div style="text-align:right">
        <div class="count" id="count">0</div>
        <div class="muted">dates reçues</div>
      </div>
    </header>

    <div class="presence">
      <div class="pbox total"><div class="n" id="p-total">0</div><div class="l">Sur le site</div></div>
      <div class="pbox"><div class="n" id="p-form">0</div><div class="l">Formulaire</div></div>
      <div class="pbox"><div class="n" id="p-read">0</div><div class="l">Lecture / Oracle</div></div>
      <div class="pbox"><div class="n" id="p-end">0</div><div class="l">Tarot / 404</div></div>
    </div>

    <!-- Carte forcée pour tout le monde -->
    <div class="panel" id="force-panel">
      <h2>🃏 Carte de tarot pour tout le monde</h2>
      <div class="force-row">
        <select id="force-global"></select>
      </div>
      <div class="force-state" id="force-state">Au hasard (sans La Mort, Le Diable, La Tour)</div>
    </div>

    <!-- Paradoxe des anniversaires -->
    <div class="panel twins" id="twins" style="display:none">
      <h2>🎂 Même anniversaire dans la salle</h2>
      <div id="twins-list"></div>
    </div>

    <!-- Questions à l'Oracle -->
    <details class="panel" id="questions-panel" open>
      <summary><h2>☾ Questions à l'Oracle <span class="badge" id="q-count">0</span></h2></summary>
      <div id="questions-list"><div class="muted" style="margin-top:10px">Aucune question pour l'instant.</div></div>
    </details>

    <div class="toolbar">
      <select id="filter-show"><option value="*">Tous les shows</option></select>
      <select id="sort">
        <option value="recent">Plus récentes d'abord</option>
        <option value="calendar">Ordre du calendrier</option>
        <option value="age">Du plus jeune au plus vieux</option>
        <option value="name">Par prénom</option>
      </select>
      <button class="primary" id="btn-new-show">Nouveau show</button>
    </div>

    <div class="muted" id="since" style="margin-bottom:10px"></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>

    <footer>
      <button class="danger" id="btn-clear">Tout effacer</button>
      <button id="btn-logout">Déconnexion</button>
    </footer>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCP9aXtQe03-Rsd6EooVvoNCTqUm_6mQeQ",
      authDomain: "celestia-nova.firebaseapp.com",
      projectId: "celestia-nova",
      storageBucket: "celestia-nova.firebasestorage.app",
      messagingSenderId: "711594265636",
      appId: "1:711594265636:web:19798a2f32ae4fbf7a5cb1"
    };

    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();
    var db = firebase.firestore();

    var MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    var CHINESE = ["Singe","Coq","Chien","Cochon","Rat","Bœuf","Tigre","Lapin","Dragon","Serpent","Cheval","Chèvre"];
    var CARDS = ["Le Mat","Le Bateleur","La Papesse","L'Impératrice","L'Empereur","Le Pape","L'Amoureux","Le Chariot","La Force","L'Ermite","La Roue de Fortune","La Justice","Le Pendu","La Mort","Tempérance","Le Diable","La Tour","L'Étoile","La Lune","Le Soleil","Le Jugement","Le Monde"];
    var NUMS = ["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"];
    var CELEBS = {
      1:{1:"Christine Lagarde",8:"Elvis Presley",15:"Pitbull",17:"Jim Carrey",20:"Omar Sy",25:"Volodymyr Zelensky"},
      2:{5:"Cristiano Ronaldo",12:"Charles Darwin",14:"Ed Sheeran",17:"Michael Jordan",22:"Drew Barrymore",26:"Rihanna"},
      3:{1:"Justin Bieber",6:"Michel-Ange",10:"Sharon Stone",14:"Albert Einstein",21:"Antoine Griezmann",30:"Céline Dion"},
      4:{7:"Jackie Chan",9:"Jean-Paul Belmondo",15:"Emma Watson",21:"Élisabeth II",23:"Gilles Lellouche",28:"Jessica Alba"},
      5:{2:"David Beckham",11:"Laetitia Casta",13:"Robert Pattinson",19:"Squeezie",22:"Novak Djokovic",26:"Lenny Kravitz"},
      6:{1:"Morgan Freeman",9:"Johnny Hallyday",18:"Jamel Debbouze",21:"Zinédine Zidane",24:"Lionel Messi",26:"Ariana Grande"},
      7:{3:"Tom Cruise",9:"Tom Hanks",10:"Gims",16:"Will Ferrell",21:"Charlotte Gainsbourg",30:"Arnold Schwarzenegger"},
      8:{4:"Barack Obama",8:"Roger Federer",10:"Antonio Banderas",15:"Ben Affleck",21:"Usain Bolt",29:"Michael Jackson"},
      9:{2:"Keanu Reeves",4:"Beyoncé",12:"Paul Walker",18:"Ronaldo Nazário",25:"Will Smith",30:"Marion Cotillard"},
      10:{8:"Matt Damon",16:"Charles Leclerc",21:"Kim Kardashian",23:"Ryan Reynolds",25:"Katy Perry",28:"Bill Gates"},
      11:{7:"David Guetta",11:"Leonardo DiCaprio",17:"Sophie Marceau",22:"Scarlett Johansson",25:"Gaspard Ulliel",30:"Kaley Cuoco"},
      12:{3:"Julianne Moore",8:"Thylane Blondeau",18:"Brad Pitt",20:"Kylian Mbappé",25:"Justin Trudeau",30:"LeBron James"}
    };

    function zodiac(d, m) {
      if ((m==1&&d>=20)||(m==2&&d<=18)) return "Verseau";
      if ((m==2&&d>=19)||(m==3&&d<=20)) return "Poissons";
      if ((m==3&&d>=21)||(m==4&&d<=19)) return "Bélier";
      if ((m==4&&d>=20)||(m==5&&d<=20)) return "Taureau";
      if ((m==5&&d>=21)||(m==6&&d<=20)) return "Gémeaux";
      if ((m==6&&d>=21)||(m==7&&d<=22)) return "Cancer";
      if ((m==7&&d>=23)||(m==8&&d<=22)) return "Lion";
      if ((m==8&&d>=23)||(m==9&&d<=22)) return "Vierge";
      if ((m==9&&d>=23)||(m==10&&d<=22)) return "Balance";
      if ((m==10&&d>=23)||(m==11&&d<=21)) return "Scorpion";
      if ((m==11&&d>=22)||(m==12&&d<=21)) return "Sagittaire";
      return "Capricorne";
    }
    function age(d, m, y) {
      var now = new Date(), a = now.getFullYear() - y;
      if (now.getMonth() + 1 < m || (now.getMonth() + 1 == m && now.getDate() < d)) a--;
      return a;
    }
    function daysToBirthday(d, m) {
      var now = new Date(); now.setHours(0,0,0,0);
      var next = new Date(now.getFullYear(), m - 1, d);
      if (next < now) next.setFullYear(now.getFullYear() + 1);
      return Math.round((next - now) / 86400000);
    }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function hhmm(t, sec) {
      var d = new Date(t), p = function (n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getHours()) + ':' + p(d.getMinutes()) + (sec ? ':' + p(d.getSeconds()) : '');
    }
    function validCard(n) { return typeof n === 'number' && n % 1 === 0 && n >= 0 && n <= 21; }
    function cardLabel(i) { return NUMS[i] + ' · ' + CARDS[i]; }
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    // ---- État ----
    var showStart = Number(safeGet('cn_show_start')) || (Date.now() - 6 * 3600 * 1000); // défaut : 6 dernières heures
    var entries = [];          // lectures
    var questions = [];        // questions à l'Oracle
    var draws = {};            // pid -> dernière carte tirée
    var controls = {};         // pid -> carte forcée ; 'global' -> carte forcée pour tous
    var presence = {};
    var seen = {}, seenQ = {};
    var firstLoad = true, firstLoadQ = true;
    var unsubs = [];
    var renderPending = false;

    // ---- Connexion ----
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
    document.getElementById('btn-login').onclick = function () {
      var err = document.getElementById('login-err'); err.textContent = '';
      auth.signInWithEmailAndPassword(
        document.getElementById('email').value.trim(),
        document.getElementById('pass').value
      ).catch(function () { err.textContent = 'Identifiants invalides.'; });
    };
    document.getElementById('pass').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
    document.getElementById('btn-logout').onclick = function () { auth.signOut(); };

    auth.onAuthStateChanged(function (user) {
      document.getElementById('login').style.display = user ? 'none' : 'block';
      document.getElementById('app').style.display = user ? 'block' : 'none';
      stopAll();
      if (user) { listenShow(); listenControls(); listenPresence(); }
    });

    function stopAll() { unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = []; }

    // ---- Écoute en temps réel : lectures, questions, tirages ----
    var showUnsubs = [];
    function listenShow() {
      showUnsubs.forEach(function (u) { try { u(); } catch (e) {} });
      showUnsubs = [];
      entries = []; questions = []; draws = {}; seen = {}; seenQ = {};
      firstLoad = true; firstLoadQ = true;
      setStatus(false, 'Connexion…');
      updateSince();
      var since = firebase.firestore.Timestamp.fromMillis(showStart);

      showUnsubs.push(db.collection('lectures').where('cree', '>=', since).orderBy('cree', 'desc')
        .onSnapshot(function (snap) {
          var gotNew = false;
          entries = snap.docs.map(function (doc) {
            var x = doc.data();
            var isNew = !seen[doc.id];
            seen[doc.id] = true;
            if (isNew && !firstLoad) gotNew = true;
            return {
              id: doc.id, pid: x.pid || '', prenom: x.prenom || '',
              d: x.jour, m: x.mois, y: x.annee, show: x.show || 'general',
              t: x.cree ? x.cree.toMillis() : Date.now(), fresh: isNew && !firstLoad
            };
          });
          firstLoad = false;
          setStatus(true, 'En direct');
          if (gotNew && navigator.vibrate) navigator.vibrate(60);
          refreshShowFilter();
          requestRender();
        }, function () { setStatus(false, 'Hors ligne — vérifie les règles Firestore'); }));

      showUnsubs.push(db.collection('questions').where('cree', '>=', since)
        .onSnapshot(function (snap) {
          var gotNew = false;
          questions = snap.docs.map(function (doc) {
            var x = doc.data();
            if (!seenQ[doc.id]) { seenQ[doc.id] = true; if (!firstLoadQ) gotNew = true; }
            return { id: doc.id, pid: x.pid || '', prenom: x.prenom || '', q: x.question || '', show: x.show || 'general', t: x.cree ? x.cree.toMillis() : Date.now() };
          }).sort(function (a, b) { return b.t - a.t; });
          firstLoadQ = false;
          if (gotNew && navigator.vibrate) navigator.vibrate([40, 60, 40]);
          renderQuestions();
          requestRender();
        }, function () {}));

      showUnsubs.push(db.collection('tirages').where('cree', '>=', since)
        .onSnapshot(function (snap) {
          var latest = {};
          snap.docs.forEach(function (doc) {
            var x = doc.data(), t = x.cree ? x.cree.toMillis() : Date.now();
            if (!x.pid || !validCard(x.carte)) return;
            if (!latest[x.pid] || latest[x.pid].t < t) latest[x.pid] = { carte: x.carte, t: t };
          });
          draws = latest;
          requestRender();
        }, function () {}));

      unsubs = unsubs.concat(showUnsubs);
    }

    // ---- Cartes forcées ----
    function listenControls() {
      unsubs.push(db.collection('controle').onSnapshot(function (snap) {
        controls = {};
        snap.docs.forEach(function (doc) {
          var v = doc.data().carte;
          if (!validCard(v)) return;
          controls[doc.id === 'global' ? 'global' : doc.id.replace(/^p_/, '')] = v;
        });
        renderForcePanel();
        requestRender();
      }, function () {}));
    }

    function setGlobalCard(v) {
      db.collection('controle').doc('global').set({ carte: v }).catch(function () { alert('Impossible d\'enregistrer la carte. Vérifie les règles Firestore.'); });
    }
    function setPersonalCard(pid, v) {
      if (!pid) return;
      var ref = db.collection('controle').doc('p_' + pid);
      (v < 0 ? ref.delete() : ref.set({ carte: v })).catch(function () { alert('Impossible d\'enregistrer la carte.'); });
    }

    function fillCardSelect(sel, firstLabel, current) {
      sel.innerHTML = '';
      var o = el('option', null, firstLabel); o.value = '-1'; sel.appendChild(o);
      for (var i = 0; i < 22; i++) { var c = el('option', null, cardLabel(i)); c.value = String(i); sel.appendChild(c); }
      sel.value = String(validCard(current) ? current : -1);
    }

    var forceGlobalSel = document.getElementById('force-global');
    fillCardSelect(forceGlobalSel, '🎲 Au hasard', -1);
    forceGlobalSel.onchange = function () { setGlobalCard(parseInt(this.value, 10)); };

    function renderForcePanel() {
      var g = controls.global;
      if (document.activeElement !== forceGlobalSel) forceGlobalSel.value = String(validCard(g) ? g : -1);
      var panel = document.getElementById('force-panel');
      var state = document.getElementById('force-state');
      state.innerHTML = '';
      if (validCard(g)) {
        panel.classList.add('forced');
        state.appendChild(document.createTextNode('Forcée : '));
        state.appendChild(el('b', null, CARDS[g]));
        state.appendChild(document.createTextNode(' — tout le monde la recevra en appuyant sur le bouton.'));
      } else {
        panel.classList.remove('forced');
        state.textContent = 'Au hasard (sans La Mort, Le Diable, La Tour)';
      }
    }

    // ---- Présence en direct ----
    var ACTIVE_MS = 75000; // présent si vu dans les 75 dernières secondes (signal aux 30 s)
    function listenPresence() {
      presence = {};
      unsubs.push(db.collection('presence')
        .where('vu', '>=', firebase.firestore.Timestamp.fromMillis(Date.now() - 10 * 60000))
        .onSnapshot(function (snap) {
          snap.docChanges().forEach(function (ch) {
            if (ch.type === 'removed') { delete presence[ch.doc.id]; return; }
            var x = ch.doc.data();
            presence[ch.doc.id] = { show: x.show || 'general', etape: x.etape, t: x.vu ? x.vu.toMillis() : Date.now() };
          });
          renderPresence();
        }, function () {}));
    }

    function renderPresence() {
      var f = document.getElementById('filter-show').value;
      var now = Date.now(), c = { total: 0, formulaire: 0, lecture: 0, fin: 0 };
      Object.keys(presence).forEach(function (id) {
        var p = presence[id];
        if (now - p.t > ACTIVE_MS) return;
        if (f !== '*' && p.show !== f) return;
        c.total++;
        if (p.etape === 'formulaire') c.formulaire++;
        else if (p.etape === 'lecture' || p.etape === 'oracle') c.lecture++;
        else c.fin++;
      });
      document.getElementById('p-total').textContent = c.total;
      document.getElementById('p-form').textContent = c.formulaire;
      document.getElementById('p-read').textContent = c.lecture;
      document.getElementById('p-end').textContent = c.fin;
    }
    setInterval(renderPresence, 3000);

    // Ménage automatique : présences inactives depuis plus de 10 min
    setInterval(function () {
      if (!auth.currentUser) return;
      db.collection('presence')
        .where('vu', '<', firebase.firestore.Timestamp.fromMillis(Date.now() - 10 * 60000))
        .limit(400).get().then(function (snap) {
          if (snap.empty) return;
          var b = db.batch();
          snap.docs.forEach(function (d) { b.delete(d.ref); });
          return b.commit();
        }).catch(function () {});
    }, 60000);

    // ---- Affichage ----
    function setStatus(on, txt) {
      document.getElementById('dot').className = 'dot' + (on ? ' on' : '');
      document.getElementById('status').textContent = txt;
    }
    function updateSince() {
      var d = new Date(showStart);
      document.getElementById('since').textContent =
        'Depuis ' + d.toLocaleDateString('fr-CA', { weekday: 'short', day: 'numeric', month: 'short' }) +
        ' à ' + d.toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' });
    }

    function refreshShowFilter() {
      var sel = document.getElementById('filter-show'), cur = sel.value;
      var shows = {};
      entries.forEach(function (e) { shows[e.show] = (shows[e.show] || 0) + 1; });
      sel.innerHTML = '';
      var all = el('option', null, 'Tous les shows'); all.value = '*'; sel.appendChild(all);
      Object.keys(shows).sort().forEach(function (s) {
        var o = el('option', null, s + ' (' + shows[s] + ')'); o.value = s; sel.appendChild(o);
      });
      sel.value = shows[cur] ? cur : '*';
    }

    function personLabel(e) {
      return e.prenom ? e.prenom : (age(e.d, e.m, e.y) + ' ans (' + e.y + ')');
    }

    // Ne redessine pas la liste pendant que tu manipules un menu (sinon il se fermerait)
    function requestRender() {
      var a = document.activeElement;
      if (a && a.tagName === 'SELECT' && document.getElementById('list').contains(a)) {
        renderPending = true;
        return;
      }
      render();
    }
    document.addEventListener('focusout', function () {
      setTimeout(function () { if (renderPending) { renderPending = false; requestRender(); } }, 50);
    });

    function filtered() {
      var f = document.getElementById('filter-show').value;
      return entries.filter(function (e) { return f === '*' || e.show === f; });
    }

    function renderTwins(list) {
      var groups = {};
      list.forEach(function (e) {
        var k = e.m * 100 + e.d;
        (groups[k] = groups[k] || []).push(e);
      });
      var keys = Object.keys(groups).filter(function (k) { return groups[k].length > 1; })
        .sort(function (a, b) { return groups[b].length - groups[a].length || a - b; });
      var box = document.getElementById('twins'), out = document.getElementById('twins-list');
      out.innerHTML = '';
      var twinIds = {};
      keys.forEach(function (k) {
        var g = groups[k];
        g.forEach(function (e) { twinIds[e.id] = true; });
        var line = el('div', 'twin-line');
        line.appendChild(el('b', null, g[0].d + ' ' + MONTHS[g[0].m - 1]));
        line.appendChild(document.createTextNode(' — ' + g.map(personLabel).join(' · ') + (g.length > 2 ? '  (' + g.length + ' personnes !)' : '')));
        out.appendChild(line);
      });
      box.style.display = keys.length ? 'block' : 'none';
      return twinIds;
    }

    function renderQuestions() {
      var f = document.getElementById('filter-show').value;
      var list = questions.filter(function (q) { return f === '*' || q.show === f; });
      document.getElementById('q-count').textContent = list.length;
      var box = document.getElementById('questions-list');
      box.innerHTML = '';
      if (!list.length) { box.appendChild(el('div', 'muted', 'Aucune question pour l\'instant.')); box.firstChild.style.marginTop = '10px'; return; }
      var byPid = {};
      entries.forEach(function (e) { if (e.pid && !byPid[e.pid]) byPid[e.pid] = e; });
      list.forEach(function (q) {
        var row = el('div', 'q');
        var who = el('div', 'who');
        var person = byPid[q.pid];
        var name = q.prenom || (person && person.prenom) || '';
        if (name) who.appendChild(el('b', null, name));
        if (person) who.appendChild(document.createTextNode((name ? ' · ' : '') + person.d + ' ' + MONTHS[person.m - 1] + ' ' + person.y + ' · ' + zodiac(person.d, person.m)));
        if (!name && !person) who.appendChild(document.createTextNode('Anonyme'));
        who.appendChild(document.createTextNode(' · ' + hhmm(q.t)));
        row.appendChild(who);
        row.appendChild(el('div', 'text', q.q));
        box.appendChild(row);
      });
    }

    function render() {
      var sort = document.getElementById('sort').value;
      var list = filtered();

      if (sort === 'calendar') list.sort(function (a, b) { return (a.m - b.m) || (a.d - b.d); });
      else if (sort === 'age') list.sort(function (a, b) { return (b.y - a.y) || (b.m - a.m) || (b.d - a.d); });
      else if (sort === 'name') list.sort(function (a, b) {
        if (!a.prenom !== !b.prenom) return a.prenom ? -1 : 1;
        return a.prenom.localeCompare(b.prenom, 'fr');
      });

      document.getElementById('count').textContent = list.length;
      var twinIds = renderTwins(list);
      renderQuestions();

      // Répartition par signe
      var chips = document.getElementById('chips'); chips.innerHTML = '';
      var bySign = {};
      list.forEach(function (e) { var z = zodiac(e.d, e.m); bySign[z] = (bySign[z] || 0) + 1; });
      Object.keys(bySign).sort(function (a, b) { return bySign[b] - bySign[a]; }).forEach(function (z) {
        var c = el('span', 'chip'); c.appendChild(document.createTextNode(z + ' '));
        c.appendChild(el('b', null, String(bySign[z]))); chips.appendChild(c);
      });

      // Questions par personne
      var qByPid = {};
      questions.forEach(function (q) { if (q.pid) (qByPid[q.pid] = qByPid[q.pid] || []).push(q); });

      var box = document.getElementById('list'); box.innerHTML = '';
      if (!list.length) {
        box.appendChild(el('div', 'empty', 'En attente des premières dates…'));
        return;
      }
      list.forEach(function (e) {
        var card = el('div', 'entry' + (e.fresh ? ' fresh' : '') + (twinIds[e.id] ? ' twin' : ''));
        if (e.prenom) card.appendChild(el('div', 'name', e.prenom));
        card.appendChild(el('div', 'dob', e.d + ' ' + MONTHS[e.m - 1] + ' ' + e.y));
        card.appendChild(el('div', 'age', age(e.d, e.m, e.y) + ' ans'));

        var meta = el('div', 'meta');
        meta.appendChild(el('b', null, zodiac(e.d, e.m)));
        meta.appendChild(document.createTextNode(' · ' + CHINESE[e.y % 12]));
        var dtb = daysToBirthday(e.d, e.m);
        if (dtb === 0) meta.appendChild(document.createTextNode(' · 🎂 C\'EST SA FÊTE AUJOURD\'HUI'));
        else if (dtb <= 30) meta.appendChild(document.createTextNode(' · fête dans ' + dtb + ' j'));
        card.appendChild(meta);

        card.appendChild(el('div', 'time', hhmm(e.t, true) + (e.show !== 'general' ? ' · ' + e.show : '')));

        if (twinIds[e.id]) card.appendChild(el('div', 'full twin-tag', '🎂 Même anniversaire qu\'une autre personne'));

        var celeb = CELEBS[e.m] && CELEBS[e.m][e.d];
        if (celeb) card.appendChild(el('div', 'full', 'Même jour que ' + celeb));

        var drawn = e.pid && draws[e.pid];
        if (drawn) {
          var dl = el('div', 'full');
          dl.appendChild(document.createTextNode('🃏 A tiré : '));
          dl.appendChild(el('b', null, CARDS[drawn.carte]));
          card.appendChild(dl);
        }

        (qByPid[e.pid] || []).forEach(function (q) {
          var qb = el('div', 'eq');
          qb.appendChild(el('span', null, '☾ Oracle · ' + hhmm(q.t)));
          qb.appendChild(document.createElement('br'));
          qb.appendChild(document.createTextNode(q.q));
          card.appendChild(qb);
        });

        if (e.pid) {
          var ctrl = el('div', 'ctrl');
          ctrl.appendChild(el('label', null, 'Sa carte :'));
          var sel = document.createElement('select');
          var mine = controls[e.pid];
          fillCardSelect(sel, validCard(controls.global) ? 'Comme tous : ' + CARDS[controls.global] : 'Comme tous : hasard', mine);
          if (validCard(mine)) sel.className = 'on';
          (function (pid) { sel.onchange = function () { setPersonalCard(pid, parseInt(this.value, 10)); this.blur(); }; })(e.pid);
          ctrl.appendChild(sel);
          card.appendChild(ctrl);
        }

        box.appendChild(card);
        if (e.fresh) { setTimeout(function () { card.classList.remove('fresh'); }, 6000); e.fresh = false; }
      });
    }

    document.getElementById('filter-show').onchange = function () { render(); renderPresence(); };
    document.getElementById('sort').onchange = render;

    document.getElementById('btn-new-show').onclick = function () {
      if (!confirm('Démarrer un nouveau show ? La liste repartira de zéro à partir de maintenant.')) return;
      showStart = Date.now();
      safeSet('cn_show_start', String(showStart));
      unsubs = unsubs.filter(function (u) { return showUnsubs.indexOf(u) === -1; });
      listenShow();
    };

    document.getElementById('btn-clear').onclick = function () {
      if (!confirm('Supprimer définitivement TOUTES les données (dates, prénoms, questions, tirages, cartes forcées) ?')) return;
      var cols = ['lectures', 'questions', 'tirages', 'presence', 'controle'];
      Promise.all(cols.map(function (c) { return db.collection(c).get(); })).then(function (snaps) {
        var docs = [];
        snaps.forEach(function (s) { docs = docs.concat(s.docs); });
        var commits = [], b = db.batch(), n = 0;
        docs.forEach(function (doc) {
          b.delete(doc.ref); n++;
          if (n % 450 === 0) { commits.push(b.commit()); b = db.batch(); }
        });
        commits.push(b.commit());
        return Promise.all(commits);
      }).then(function () { alert('Tout est effacé.'); })
        .catch(function () { alert('Erreur pendant la suppression.'); });
    };
  </script>
</body>
</html>
